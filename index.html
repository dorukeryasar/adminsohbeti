<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Doruk TV Sohbet</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0d1117;color:#fff;font-family:system-ui,Arial,sans-serif;height:100vh}button,input{font:inherit}.hidden{display:none!important}
#join{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at top,#26345f,#0d1117 60%)}.card{width:min(430px,92%);background:#151b25;border:1px solid #29354a;border-radius:24px;padding:30px;box-shadow:0 20px 80px #0009}.logo{font-size:42px}.card h1{margin:8px 0}.card p{color:#9ba6b8}.card input{width:100%;padding:14px;border-radius:12px;border:1px solid #344057;background:#0d121a;color:#fff;outline:0;margin-top:5px}.card button{width:100%;margin-top:12px;padding:14px;border:0;border-radius:12px;background:#5c72ff;color:#fff;font-weight:700}.error{color:#ff7e88;font-size:14px;margin-top:10px;min-height:20px}
#app{height:100vh;display:grid;grid-template-rows:64px 1fr 70px}header{display:flex;align-items:center;gap:12px;padding:0 16px;background:#151b25;border-bottom:1px solid #283246}.logoSmall{width:40px;height:40px;border-radius:12px;background:#5c72ff;display:grid;place-items:center}.title{font-weight:800}.sub{font-size:12px;color:#8995a9}.status{margin-left:auto;color:#67dc95;font-size:13px}.adminBtn{margin-left:10px;border:0;border-radius:9px;background:#252d3d;color:#fff;padding:8px 10px}
main{display:grid;grid-template-columns:235px 1fr;min-height:0}.side{background:#111720;border-right:1px solid #283246;padding:16px;overflow:auto}.side h3{font-size:12px;color:#8995a9;text-transform:uppercase;margin:0 0 12px}.person{display:flex;align-items:center;gap:9px;background:#19202c;border-radius:10px;padding:9px;margin-bottom:7px}.avatar{width:30px;height:30px;border-radius:50%;background:#303b52;display:grid;place-items:center;font-size:12px}.chat{min-width:0;display:flex;flex-direction:column}.messages{overflow:auto;flex:1;padding:20px}.msg{max-width:76%;margin-bottom:15px}.mine{margin-left:auto}.meta{font-size:12px;color:#8792a6;margin:0 0 5px 4px}.meta b{color:#fff}.bubble{display:inline-block;background:#202938;padding:11px 14px;border-radius:15px 15px 15px 5px;white-space:pre-wrap;overflow-wrap:anywhere}.mine .bubble{background:#5c72ff;border-radius:15px 5px 15px 15px}.admin .bubble{border:1px solid #ffcc55}.del{border:0;background:#3a2025;color:#ff9ba5;border-radius:7px;padding:4px 7px;margin-left:6px;font-size:11px}.composer{display:flex;gap:9px;padding:11px 14px;background:#151b25;border-top:1px solid #283246}.composer input{flex:1;min-width:0;background:#0d121a;border:1px solid #344057;color:#fff;padding:13px;border-radius:13px;outline:0}.composer button{border:0;background:#5c72ff;color:#fff;padding:0 20px;border-radius:13px;font-weight:700}.empty{text-align:center;color:#778399;margin-top:45px}.adminPanel{position:fixed;right:12px;top:70px;background:#171e2a;border:1px solid #344057;padding:10px;border-radius:12px;z-index:4}.adminPanel button{display:block;width:100%;margin:4px 0;border:0;border-radius:8px;background:#252e40;color:#fff;padding:9px}
@media(max-width:650px){main{grid-template-columns:1fr}.side{display:none}.msg{max-width:90%}.status{display:none}}
</style></head><body>
<section id="join"><div class="card"><div class="logo">📺</div><h1>Doruk TV Sohbet</h1><p>Gruba katılmak için kullanıcı adını yaz.</p><input id="name" maxlength="24" autocomplete="off" placeholder="Kullanıcı adın"><div id="passWrap" class="hidden"><input id="pass" type="password" placeholder="Admin şifresi"></div><div id="error" class="error"></div><button id="joinBtn">Sohbete Katıl</button></div></section>
<section id="app" class="hidden"><header><div class="logoSmall">📺</div><div><div class="title">Doruk TV Sohbet</div><div class="sub">Genel Grup</div></div><div class="status">● Canlı</div><button id="adminBtn" class="adminBtn hidden">🛡️</button></header>
<div id="adminPanel" class="adminPanel hidden"><button id="adminSend">📢 Admin mesajı</button><button id="clear">🗑️ Sohbeti temizle</button></div>
<main><aside class="side"><h3>Gruptakiler</h3><div id="people"></div></aside><section class="chat"><div id="messages" class="messages"><div class="empty">Mesajlar yükleniyor...</div></div><div class="composer"><input id="text" maxlength="1000" autocomplete="off" placeholder="Mesaj yaz..."><button id="send">Gönder</button></div></section></main></section>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=window.supabase.createClient("https://dtqrxqpmcegeptfdbugd.supabase.co","sb_publishable_WlLZ-yYXNcRfNvOk_pHh9A_V7U0IvB5");let username="",adminToken="",isAdmin=false;
const $=x=>document.getElementById(x);function esc(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
$("name").oninput=()=>{$("passWrap").classList.toggle("hidden",$("name").value.trim().toLowerCase()!=="admin")};
async function join(){ $("error").textContent="";try{let r=await db.rpc("register_chat_user",{p_username:$("name").value,p_password:$("pass").value||null});if(r.error)throw r.error;username=r.data.username;isAdmin=!!r.data.is_admin;adminToken=r.data.token||"";$("join").classList.add("hidden");$("app").classList.remove("hidden");if(isAdmin)$("adminBtn").classList.remove("hidden");await load();subscribe();renderPeople();$("text").focus()}catch(e){$("error").textContent=e.message||"Bağlantı hatası."}}
async function load(){let r=await db.from("chat_messages").select("*").order("created_at",{ascending:true}).limit(500);if(r.error){$("messages").innerHTML='<div class="empty">Mesajlar yüklenemedi.</div>';return}render(r.data||[])}
function render(a){let b=$("messages");b.innerHTML=a.length?"":'<div class="empty">Henüz mesaj yok. İlk mesajı sen gönder! 👋</div>';a.forEach(m=>add(m,false));b.scrollTop=b.scrollHeight}
function add(m,scroll=true){let b=$("messages");if(b.querySelector(".empty"))b.innerHTML="";let d=document.createElement("div");d.className="msg "+(m.username===username?"mine ":"")+(m.is_admin?"admin":"");let t=new Date(m.created_at).toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"});let x=isAdmin?`<button class="del" onclick="delMsg(${m.id})">sil</button>`:"";d.innerHTML=`<div class="meta"><b>${esc(m.username)}</b>${m.is_admin?" 🛡️":""} · ${t}${x}</div><div class="bubble">${esc(m.message)}</div>`;b.appendChild(d);if(scroll)b.scrollTop=b.scrollHeight}
async function send(){let i=$("text"),m=i.value.trim();if(!m)return;i.disabled=true;let r=isAdmin?await db.rpc("admin_send_message",{p_token:adminToken,p_message:m}):await db.from("chat_messages").insert({username,message:m,is_admin:false});i.disabled=false;if(r.error){alert(r.error.message);return}i.value="";i.focus()}
async function delMsg(id){if(confirm("Bu mesaj silinsin mi?")){let r=await db.rpc("admin_delete_message",{p_token:adminToken,p_message_id:id});if(r.error)alert(r.error.message)}}
async function clearChat(){if(confirm("Tüm sohbet silinsin mi?")){let r=await db.rpc("admin_clear_messages",{p_token:adminToken});if(r.error)alert(r.error.message);else load()}}
function subscribe(){db.channel("doruk-tv").on("postgres_changes",{event:"INSERT",schema:"public",table:"chat_messages"},p=>add(p.new)).on("postgres_changes",{event:"DELETE",schema:"public",table:"chat_messages"},()=>load()).subscribe()}
async function renderPeople(){let r=await db.from("chat_users").select("username").order("created_at",{ascending:true}).limit(600);$("people").innerHTML="";(r.data||[]).forEach(x=>{let p=document.createElement("div");p.className="person";p.innerHTML=`<div class="avatar">${esc(x.username[0].toUpperCase())}</div><span>${esc(x.username)}</span>`;$("people").appendChild(p)})}
$("joinBtn").onclick=join;$("name").onkeydown=e=>e.key==="Enter"&&join();$("pass").onkeydown=e=>e.key==="Enter"&&join();$("send").onclick=send;$("text").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();send()}};$("adminBtn").onclick=()=>$("adminPanel").classList.toggle("hidden");$("adminSend").onclick=()=>$("text").focus();$("clear").onclick=clearChat;
</script></body></html>
