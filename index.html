<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Doruk TV Sohbet</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0d1117;color:#fff;font-family:Arial,sans-serif;height:100vh}
button,input{font:inherit}.hidden{display:none!important}
#join{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at top,#26345f,#0d1117 60%)}
.card{width:min(430px,92%);background:#151b25;border:1px solid #29354a;border-radius:24px;padding:30px;box-shadow:0 20px 80px #0009}
.logo{font-size:42px}.card h1{margin:8px 0}.card p{color:#9ba6b8}.card input{width:100%;padding:14px;border-radius:12px;border:1px solid #344057;background:#0d121a;color:#fff;outline:0}
.card button{width:100%;margin-top:12px;padding:14px;border:0;border-radius:12px;background:#5c72ff;color:#fff;font-weight:bold}.error{color:#ff7e88;font-size:14px;margin-top:10px;min-height:20px}
#app{height:100vh;display:grid;grid-template-rows:64px 1fr 70px}header{display:flex;align-items:center;gap:12px;padding:0 16px;background:#151b25;border-bottom:1px solid #283246}
.logoSmall{width:40px;height:40px;border-radius:12px;background:#5c72ff;display:grid;place-items:center}.title{font-weight:800}.sub{font-size:12px;color:#8995a9}.status{margin-left:auto;color:#67dc95;font-size:13px}
main{display:grid;grid-template-columns:235px 1fr;min-height:0}.side{background:#111720;border-right:1px solid #283246;padding:16px;overflow:auto}.side h3{font-size:12px;color:#8995a9;text-transform:uppercase;margin:0 0 12px}
.person{display:flex;align-items:center;gap:9px;background:#19202c;border-radius:10px;padding:9px;margin-bottom:7px}.avatar{width:30px;height:30px;border-radius:50%;background:#303b52;display:grid;place-items:center;font-size:12px}
.chat{min-width:0;display:flex;flex-direction:column}.messages{overflow:auto;flex:1;padding:20px}.msg{max-width:76%;margin-bottom:15px}.mine{margin-left:auto}.meta{font-size:12px;color:#8792a6;margin:0 0 5px 4px}.meta b{color:#fff}
.bubble{display:inline-block;background:#202938;padding:11px 14px;border-radius:15px 15px 15px 5px;white-space:pre-wrap;overflow-wrap:anywhere}.mine .bubble{background:#5c72ff;border-radius:15px 5px 15px 15px}.admin .bubble{border:1px solid #ffcc55}
.composer{display:flex;gap:9px;padding:11px 14px;background:#151b25;border-top:1px solid #283246}.composer input{flex:1;min-width:0;background:#0d121a;border:1px solid #344057;color:#fff;padding:13px;border-radius:13px;outline:0}.composer button{border:0;background:#5c72ff;color:#fff;padding:0 20px;border-radius:13px;font-weight:bold}
.empty{text-align:center;color:#778399;margin-top:45px}@media(max-width:650px){main{grid-template-columns:1fr}.side{display:none}.msg{max-width:90%}.status{display:none}}
</style></head>
<body>
<section id="join"><div class="card"><div class="logo">📺</div><h1>Doruk TV Sohbet</h1>
<p>Gruba katılmak için kullanıcı adını yaz.</p><input id="name" maxlength="24" autocomplete="off" placeholder="Kullanıcı adın">
<div id="error" class="error"></div><button id="joinBtn">Sohbete Katıl</button></div></section>
<section id="app" class="hidden"><header><div class="logoSmall">📺</div><div><div class="title">Doruk TV Sohbet</div><div class="sub">Genel Grup</div></div><div class="status">● Canlı</div></header>
<main><aside class="side"><h3>Gruptakiler</h3><div id="people"></div></aside><section class="chat">
<div id="messages" class="messages"><div class="empty">Mesajlar yükleniyor...</div></div>
<div class="composer"><input id="text" maxlength="1000" autocomplete="off" placeholder="Mesaj yaz..."><button id="send">Gönder</button></div>
</section></main></section>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://dtqrxqpmcegeptfdbugd.supabase.co";
const SUPABASE_KEY="sb_publishable_WlLZ-yYXNcRfNvOk_pHh9A_V7U0IvB5";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let username="";
const $=id=>document.getElementById(id);
function esc(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
async function makeUsername(base){
 base=base.trim();if(!base)throw new Error("Bir kullanıcı adı yaz.");
 if(base.toLowerCase()==="admin")throw new Error("Bu kullanıcı adını almaya izniniz yok.");
 const {data,error}=await db.from("chat_users").select("username").ilike("username",base);if(error)throw error;
 let candidate=base,n=1,used=new Set((data||[]).map(x=>x.username.toLowerCase()));
 while(used.has(candidate.toLowerCase()))candidate=`${base} (${n++})`;
 const {error:e}=await db.from("chat_users").insert({username:candidate});
 if(e){if(e.code==="23505")return makeUsername(base);throw e}return candidate;
}
async function join(){
 $("error").textContent="";try{username=await makeUsername($("name").value);$("join").classList.add("hidden");$("app").classList.remove("hidden");await load();subscribe();renderPeople();$("text").focus()}
 catch(e){console.error(e);$("error").textContent=e.message||"Bağlantı hatası."}
}
async function load(){const {data,error}=await db.from("chat_messages").select("*").order("created_at",{ascending:true}).limit(500);if(error){$("messages").innerHTML='<div class="empty">Mesajlar yüklenemedi.</div>';return}renderMessages(data||[])}
function renderMessages(rows){const box=$("messages");if(!rows.length){box.innerHTML='<div class="empty">Henüz mesaj yok. İlk mesajı sen gönder! 👋</div>';return}box.innerHTML="";
 rows.forEach(m=>{const d=document.createElement("div");d.className="msg "+(m.username===username?"mine ":"")+(m.is_admin?"admin":"");const t=new Date(m.created_at).toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"});d.innerHTML=`<div class="meta"><b>${esc(m.username)}</b>${m.is_admin?" 🛡️":""} · ${t}</div><div class="bubble">${esc(m.message)}</div>`;box.appendChild(d)});box.scrollTop=box.scrollHeight}
async function send(){const input=$("text"),message=input.value.trim();if(!message)return;input.disabled=true;const {error}=await db.from("chat_messages").insert({username,message,is_admin:false});input.disabled=false;if(error){alert("Mesaj gönderilemedi.");return}input.value="";input.focus()}
function subscribe(){db.channel("doruk-tv-messages").on("postgres_changes",{event:"INSERT",schema:"public",table:"chat_messages"},p=>{const m=p.new,box=$("messages");if(box.querySelector(".empty"))box.innerHTML="";const d=document.createElement("div");d.className="msg "+(m.username===username?"mine ":"")+(m.is_admin?"admin":"");const t=new Date(m.created_at).toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"});d.innerHTML=`<div class="meta"><b>${esc(m.username)}</b>${m.is_admin?" 🛡️":""} · ${t}</div><div class="bubble">${esc(m.message)}</div>`;box.appendChild(d);box.scrollTop=box.scrollHeight}).subscribe()}
async function renderPeople(){const {data}=await db.from("chat_users").select("username").order("created_at",{ascending:true}).limit(600);$("people").innerHTML="";(data||[]).forEach(x=>{const p=document.createElement("div");p.className="person";p.innerHTML=`<div class="avatar">${esc(x.username[0].toUpperCase())}</div><span>${esc(x.username)}</span>`;$("people").appendChild(p)})}
$("joinBtn").onclick=join;$("name").onkeydown=e=>{if(e.key==="Enter")join()};$("send").onclick=send;$("text").onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}};
</script></body></html>
